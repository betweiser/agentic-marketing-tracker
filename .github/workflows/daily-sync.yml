name: Sync Agentic AI Marketing Tracker

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key to file
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/service_account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run sync
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_BASE_URL: "https://metabase-lierhfgoeiwhr.newtonschool.co"
          METABASE_CARD_ID: "11715"
          GOOGLE_CREDENTIALS_FILE: /tmp/service_account.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB_NAME: "Dashboard"
        run: python sync_sheet.py
